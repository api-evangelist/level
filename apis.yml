aid: level
name: Level
description: 'Level is a stablecoin protocol that issued lvlUSD, a stablecoin fully backed by USDC and
  USDT which were deployed into blue-chip lending protocols (Aave and the Morpho Steakhouse USDC vault)
  to generate yield. Lending yield was passed back to holders through an ERC-4626 staking mechanism: lvlUSD
  could be staked for slvlUSD, a yield-accruing token that appreciates as the protocol distributes yield
  into the staking contract. Both tokens were transferable and integrated across DeFi venues including
  Morpho, Pendle, Spectra and Curve, with LayerZero OFT adapters bridging them to Base. Level exposes no
  public HTTP API — its programmable surface is a set of audited Ethereum mainnet smart contracts (lvlUSD,
  slvlUSD, LevelMinting, LevelStakingPool, LevelUsdPointsFarm, LevelReserveLens) documented in GitBook
  and published on GitHub. In September 2025 the team announced it was joining the Sky (fka MakerDAO)
  ecosystem as part of Grove and that the Level protocol is being sunset: mints paused, redemptions made
  public and fixed 1:1, cooldowns cut to two seconds, final yield distribution on 2025-10-02, and the
  front end retired on 2025-12-15 with contract-level redemption remaining available indefinitely.'
