shutdown_changes:
- Mints paused — no further lvlUSD can be minted.
- Redemptions made public; previously permissioned.
- Redemption rate fixed 1:1 to underlying collateral, replacing Chainlink oracle conversion.
- Redemption and unstake cooldown periods reduced to 2 seconds.
- Per-block redemption limit raised to 1,000,000 lvlUSD.
